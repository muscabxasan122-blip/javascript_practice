
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Basketball Scoreboard</title>
  <link rel="stylesheet" href="index.css" />
</head>
<body>
  <main class="scoreboard">
    <section class="team">
      <h1>HOME</h1>
      <div class="score" id="home-score">12</div>

      <div class="buttons">
        <button onclick="addScore('home', 1)">+1</button>
        <button onclick="addScore('home', 2)">+2</button>
        <button onclick="addScore('home', 3)">+3</button>
      </div>
    </section>

    <section class="team">
      <h1>GUEST</h1>
      <div class="score" id="guest-score">5</div>

      <div class="buttons">
        <button onclick="addScore('guest', 1)">+1</button>
        <button onclick="addScore('guest', 2)">+2</button>
        <button onclick="addScore('guest', 3)">+3</button>
      </div>
    </section>
  </main>

 <script src="main.js"></script>
</body>
</html>
